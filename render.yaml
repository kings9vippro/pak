services:
  - type: worker
    name: alb-forge
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TZ
        value: Asia/Ho_Chi_Minh